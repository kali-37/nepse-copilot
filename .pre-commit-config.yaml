repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: public-file-check
        name: Public-file and credential check
        entry: python scripts/check_public_files.py
        language: system
        pass_filenames: false
        always_run: true
      - id: har-secret-scan
        name: HAR secret scan
        description: Refuse to commit any .har file (even redacted)
        entry: refusing to commit .har files — run `har redact` first
        language: fail
        files: '\.har$'
