[project]
name = "nepse-trader"
version = "0.1.0"
description = "Expert-grade NEPSE public-data aggregation, analysis, backtesting and paper-trading engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.4",
    "python-dateutil>=2.9",
    "selectolax>=0.3.21",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "freezegun>=1.5",
    "hypothesis>=6.100",
]
# Optional resilient fetch/parse backend. `scrapling` (core) enables the adaptive
# HTML Selector; `scrapling[fetchers]` adds the curl_cffi fetch engine. We use
# PLAIN mode only — no browser/stealth install (`scrapling install`) is needed.
scrapling = [
    "scrapling>=0.4",
]

[project.scripts]
nepse-trader = "nepse_trader.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nepse_trader"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# UP042: `(str, Enum)` is an intentional, widely-used idiom here (stable str()
# repr and broad compatibility); we do not require StrEnum.
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
